name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-status:
    # The org ruleset requires a "CI status" check on the default branch.
    # This repository carries release assets, a README and a license only,
    # so the check is that nothing else was committed.
    name: CI status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse anything but the README, license and this workflow
        run: |
          unexpected="$(git ls-files | grep -vxE 'README\.md|LICENSE|\.github/workflows/ci\.yml' || true)"
          if [ -n "${unexpected}" ]; then
            echo "::error::This repository holds release assets only. Unexpected files:"
            echo "${unexpected}"
            exit 1
          fi
